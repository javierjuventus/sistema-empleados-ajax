<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso | Sistema de Empleados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/estilos.css" rel="stylesheet">
</head>
<body class="login-page">
  <main class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-12 col-sm-9 col-md-6 col-lg-4">
        <section class="card shadow border-0">
          <div class="card-body p-4 p-md-5">
            <h1 class="h3 text-center mb-2">Sistema de Empleados</h1>
            <p class="text-secondary text-center mb-4">Inicia sesión para continuar</p>
            <div id="mensaje" class="alert d-none" role="alert"></div>
            <form id="formLogin">
              <input type="hidden" name="csrf_token" id="csrf_token">
              <div class="mb-3">
                <label for="usuario" class="form-label">Usuario</label>
                <input class="form-control" type="text" id="usuario" name="usuario" required autocomplete="username">
              </div>
              <div class="mb-4">
                <label for="password" class="form-label">Contraseña</label>
                <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password">
              </div>
              <button class="btn btn-primary w-100" type="submit" id="btnLogin">Ingresar</button>
            </form>
          </div>
        </section>
        <p class="text-center text-secondary small mt-3">Proyecto académico · AJAX, jQuery, PHP y MySQL</p>
      </div>
    </div>
  </main>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
